/* Critical CSS: tokens, the app shell, the landing screen, the action bar and the breakpoints.
   build.py puts this inline in index.html. Everything else is in app.css. */
:root{
  --paper:#F4F4F1; --sheet:#fff; --ink:#111318; --ink2:#555A66; --rule:#D6D6CF; --off:#B4B6BE;
  --stamp:#2845A6; --due:#C2311D; --brass:#8F6A1B;
  --sans:'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'IBM Plex Serif','IBM Plex Sans Arabic',Georgia,serif;
  --mono:'IBM Plex Mono','IBM Plex Sans Arabic',ui-monospace,monospace;
}
*{box-sizing:border-box}
/* no double-tap zoom and no 300ms wait on iOS */
html,body,#app,#app *{touch-action:manipulation}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit}
svg{display:block}
p{margin:0}
:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.num{font-variant-numeric:tabular-nums}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir=rtl] .flip{transform:scaleX(-1)}
.r{color:var(--due)}

/* ---------- desktop stage ---------- */
#stage{min-height:100%;display:grid;grid-template-columns:minmax(0,500px) auto;gap:96px;align-items:start;justify-content:center;padding:0 48px}
#pitch{max-width:500px;padding:40px 0 64px}
#dock{position:sticky;top:0;height:100vh;display:grid;place-items:center}
#device{width:410px;height:864px;border:10px solid var(--ink);border-radius:44px;overflow:hidden;background:var(--ink);flex:none}

/* ---------- app shell ---------- */
.app{height:100%;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);position:relative;overflow:hidden}
/* viewport-fit=cover: keep content clear of the notch when the phone is sideways */
.app{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.proto{background:var(--ink);color:#D9DAE0;font-size:11px;line-height:1.4;text-align:center;padding:5px 10px;flex:none}
.bar{display:flex;align-items:center;gap:10px;padding:12px 18px 8px;flex:none;min-height:52px}
.wm{font:600 22px/1 var(--serif);letter-spacing:-.01em;text-decoration:none}
a.wm{display:inline-flex;align-items:center;min-height:44px}
.bar .who{flex:1;min-width:0;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .back{display:inline-flex;align-items:center;gap:2px;font-size:15px;font-weight:500;text-decoration:none;flex:1;min-height:44px;margin-inline-start:-6px}
.lang{font-size:14px;font-weight:500;text-decoration:underline;text-underline-offset:3px;flex:none;padding:12px 0;min-height:44px;min-width:44px;text-align:end}
.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 18px 30px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--ink);background:var(--sheet);padding:0 4px env(safe-area-inset-bottom);flex:none}
.tabs a{display:grid;justify-items:center;gap:1px;padding:8px 0 8px;font-size:11.5px;color:var(--ink2);text-decoration:none;border-top:3px solid transparent;margin-top:-1px}
.tabs a.on{color:var(--ink);font-weight:600;border-top-color:var(--ink)}

h1,.t1{font:600 27px/1.15 var(--serif);margin:4px 0 8px;letter-spacing:-.01em}
[dir=rtl] h1,[dir=rtl] .t1{font:700 25px/1.4 var(--sans);letter-spacing:0}
h2{font:600 15px/1.3 var(--sans);margin:26px 0 8px}
.lede{color:var(--ink2);font-size:15px;margin:0 0 14px}
.body{font-size:15.5px}
.note{font-size:13px;color:var(--ink2);margin:10px 0 0}
.aside{border-inline-start:3px solid var(--ink);padding-inline-start:12px;font-size:14px;color:var(--ink2);margin:0 0 6px}
.meta{font-size:14px;color:var(--ink2);margin:2px 0 0}
.meta b{color:var(--ink);font-weight:600}

.btn{display:flex;align-items:center;justify-content:center;min-height:50px;padding:0 20px;border-radius:8px;background:var(--ink);color:#fff;font-weight:600;font-size:16px;text-decoration:none;width:100%;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn[disabled]{background:transparent;color:var(--ink2);border:1.5px dashed var(--ink2);cursor:not-allowed}
.link{font-weight:500;text-decoration:underline;text-underline-offset:3px;display:inline-flex;align-items:center;min-height:44px;padding:10px 0}

.rows{border-top:1px solid var(--ink)}
.rows>*{display:flex;gap:12px;align-items:baseline;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--rule);text-decoration:none}
.rows small{display:block;font-size:13px;color:var(--ink2);font-weight:400}
.rows .new{font-weight:600}
.rows a .ico{align-self:center;color:var(--ink2);width:18px;height:18px}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- landing ---------- */
.land{flex:1;overflow-y:auto;padding:0 20px 36px}
.land .top,.ptop{display:flex;justify-content:space-between;align-items:center;padding:12px 0 0}
.hl{font:600 37px/1.08 var(--serif);letter-spacing:-.018em;margin:24px 0 12px}
[dir=rtl] .hl{font:700 33px/1.3 var(--sans);letter-spacing:0}
.hl span{display:block}
.land .lede,#pitch .lede{font-size:16px;margin-bottom:22px}
.lic{position:relative;background:#fff;border:1px solid #C6C6BE;border-radius:3px;padding:12px 14px 12px;font-size:12px;line-height:1.35;
  background-image:repeating-linear-gradient(135deg,rgba(40,69,166,.04) 0 1px,transparent 1px 7px),repeating-linear-gradient(45deg,rgba(40,69,166,.04) 0 1px,transparent 1px 7px);
  box-shadow:0 18px 26px -22px rgba(17,19,24,.6)}
.lic-h{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:12.5px;padding-bottom:8px;border-bottom:1.5px solid var(--ink)}
.lic-r{display:grid;grid-template-columns:74px 1fr 74px;gap:8px;padding:6px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.lic-r .le,.lic-r .la{color:var(--ink2);font-size:11px}
.lic-r .la{text-align:right}
.lic-r .lv{font:500 12.5px/1.35 var(--mono);text-align:center}
.lic-f{display:flex;gap:10px;align-items:center;padding:10px 92px 0 0;font-size:10.5px;color:var(--ink2);min-height:62px}
.lic-f svg{width:44px;height:44px;flex:none}
.lic-s{position:absolute;right:-8px;bottom:-30px;width:100px;transform:rotate(-11deg)}
.cta{display:grid;gap:4px;justify-items:center;margin:44px 0 0}
.dates{border-top:1px solid var(--ink)}
.dates>div{display:grid;grid-template-columns:46px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.dates b{font:600 24px/1 var(--serif)}
.dates strong{display:block;font-weight:600;font-size:15.5px}
.dates small{font-size:14px;color:var(--ink2)}
.dates small.r{color:var(--due);font-weight:600}
.dates .dk{font-size:11px;color:var(--ink2);display:block;font-weight:500;font-family:var(--sans);margin-bottom:1px}
.loop{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.loop li{display:grid;grid-template-columns:46px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:15.5px;align-items:baseline}
.loop b{font:600 20px/1 var(--serif)}
.proof{margin:26px 0 0;display:grid;gap:8px;font-size:13.5px;color:var(--ink2)}
.proof b{color:var(--ink);font-weight:600}
.pfoot{margin-top:16px;display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px}

/* action bar: a fixed row of the shell, not a sticky child of the scroller */
.actions{flex:none;background:var(--paper);border-top:1px solid var(--rule);padding:12px 18px 10px}
.actions.end{padding-bottom:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.byc{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink2)}
.byc img{height:26px;width:auto;flex:none;max-width:45%;object-fit:contain}

/* ---------- utilities (instead of style attributes, which the Content-Security-Policy does not allow) ---------- */
.ltr{direction:ltr}
.m0{margin:0!important}
.mt6{margin-top:6px!important}.mt8{margin-top:8px!important}.mt10{margin-top:10px!important}.mt12{margin-top:12px!important}.mt14{margin-top:14px!important}.mt16{margin-top:16px!important}.mt18{margin-top:18px!important}
.mb8{margin-bottom:8px!important}
.gap14{height:14px}
/* ---------- sizes ---------- */
/* phone layout: narrow screens, and wide-but-short ones (an iPhone Pro Max held sideways is 932px wide) */
@media (max-width:899px),(max-height:639px){
  /* 100% is the fallback for iOS before 15.4, which does not know dvh and would drop the rule */
  body:not(.is-shots){overflow:hidden;overscroll-behavior:none}
  #stage{display:block;padding:0;height:100%;height:100dvh;min-height:0}
  #pitch{display:none}
  #dock{position:static;height:100%;height:100dvh;display:block}
  #device{width:100%;height:100%;height:100dvh;border:0;border-radius:0}
}
/* phone held sideways: the action bar becomes one row and the bars slim down, so content keeps most of the height */
@media (max-height:480px){
  .bar{min-height:44px;padding-top:0;padding-bottom:0}
  .actions{display:flex;align-items:center;gap:14px;padding:8px 18px}
  .actions.end{padding-bottom:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  .actions .btn{min-height:44px;flex:1}
  .actions .skip{width:auto;margin:0;flex:none;padding:10px 6px}
  .tabs a{grid-auto-flow:column;justify-content:center;align-items:center;gap:6px;padding:0;min-height:44px}
}
@media (max-width:359px){
  /* iPhone SE and other 320px screens: give the licence value column room so the trade name does not wrap to seven lines */
  .hl{font-size:33px;margin-top:18px}
  [dir=rtl] .hl{font-size:30px}
  .lic{padding:12px}
  .lic-r{grid-template-columns:54px 1fr 54px;gap:6px}
  .lic-r .lv{font-size:11.5px}
}
@media (min-width:900px) and (min-height:640px){
  #pitch .hl{font-size:46px;margin-top:22px}
  [dir=rtl] #pitch .hl{font-size:38px}
  #pitch .cta{grid-template-columns:auto auto;justify-content:start;align-items:center;gap:22px;margin-top:40px}
  #pitch .btn{width:auto}
  #pitch .dates b{font-size:22px}
}
@media (min-width:900px) and (min-height:640px) and (max-height:980px){
  #stage{gap:72px;padding:0 44px}
  #pitch{padding-top:26px}
  #device{zoom:.84}
  #pitch .hl{font-size:40px;margin:16px 0 8px}
  [dir=rtl] #pitch .hl{font-size:34px}
  #pitch .lede{font-size:15px;margin-bottom:16px}
}
@media (min-width:900px) and (min-height:640px) and (max-height:800px){
  #device{zoom:.72}
}
/* the three lines on the building screen start hidden and are revealed by an animation: show them outright when motion is reduced */
</style>
