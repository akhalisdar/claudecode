ode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{
  --paper:#F4F4F1; --sheet:#fff; --ink:#111318; --ink2:#555A66; --rule:#D6D6CF; --off:#B4B6BE;
  --stamp:#2845A6; --due:#C2311D; --brass:#8F6A1B;
  --sans:'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'IBM Plex Serif','IBM Plex Sans Arabic',Georgia,serif;
  --mono:'IBM Plex Mono','IBM Plex Sans Arabic',ui-monospace,monospace;
}
*{box-sizing:border-box}
/* no double-tap zoom and no 300ms wait on iOS */
html,body,#app,#app *{touch-action:manipulation}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit}
svg{display:block}
p{margin:0}
:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.num{font-variant-numeric:tabular-nums}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir=rtl] .flip{transform:scaleX(-1)}
.r{color:var(--due)}

/* ---------- desktop stage ---------- */
#stage{min-height:100%;display:grid;grid-template-columns:minmax(0,500px) auto;gap:96px;align-items:start;justify-content:center;padding:0 48px}
#pitch{max-width:500px;padding:40px 0 64px}
#dock{position:sticky;top:0;height:100vh;display:grid;place-items:center}
#device{width:410px;height:864px;border:10px solid var(--ink);border-radius:44px;overflow:hidden;background:var(--ink);flex:none}

/* ---------- app shell ---------- */
.app{height:100%;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);position:relative;overflow:hidden}
/* viewport-fit=cover: keep content clear of the notch when the phone is sideways */
.app{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.proto{background:var(--ink);color:#D9DAE0;font-size:11px;line-height:1.4;text-align:center;padding:5px 10px;flex:none}
.bar{display:flex;align-items:center;gap:10px;padding:12px 18px 8px;flex:none;min-height:52px}
.wm{font:600 22px/1 var(--serif);letter-spacing:-.01em;text-decoration:none}
.bar .who{flex:1;min-width:0;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .back{display:inline-flex;align-items:center;gap:2px;font-size:15px;font-weight:500;text-decoration:none;flex:1;min-height:44px;margin-inline-start:-6px}
.lang{font-size:14px;font-weight:500;text-decoration:underline;text-underline-offset:3px;flex:none;padding:12px 0;min-height:44px}
.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 18px 30px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--ink);background:var(--sheet);padding:0 4px env(safe-area-inset-bottom);flex:none}
.tabs a{display:grid;justify-items:center;gap:1px;padding:8px 0 8px;font-size:11.5px;color:var(--ink2);text-decoration:none;border-top:3px solid transparent;margin-top:-1px}
.tabs a.on{color:var(--ink);font-weight:600;border-top-color:var(--ink)}

h1,.t1{font:600 27px/1.15 var(--serif);margin:4px 0 8px;letter-spacing:-.01em}
[dir=rtl] h1,[dir=rtl] .t1{font:700 25px/1.4 var(--sans);letter-spacing:0}
h2{font:600 15px/1.3 var(--sans);margin:26px 0 8px}
.lede{color:var(--ink2);font-size:15px;margin:0 0 14px}
.body{font-size:15.5px}
.note{font-size:13px;color:var(--ink2);margin:10px 0 0}
.aside{border-inline-start:3px solid var(--ink);padding-inline-start:12px;font-size:14px;color:var(--ink2);margin:0 0 6px}
.meta{font-size:14px;color:var(--ink2);margin:2px 0 0}
.meta b{color:var(--ink);font-weight:600}

.btn{display:flex;align-items:center;justify-content:center;min-height:50px;padding:0 20px;border-radius:8px;background:var(--ink);color:#fff;font-weight:600;font-size:16px;text-decoration:none;width:100%;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn[disabled]{background:transparent;color:var(--ink2);border:1.5px dashed var(--ink2);cursor:not-allowed}
.link{font-weight:500;text-decoration:underline;text-underline-offset:3px;display:inline-block;padding:11px 0}

.rows{border-top:1px solid var(--ink)}
.rows>*{display:flex;gap:12px;align-items:baseline;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--rule);text-decoration:none}
.rows small{display:block;font-size:13px;color:var(--ink2);font-weight:400}
.rows .new{font-weight:600}
.rows a .ico{align-self:center;color:var(--ink2);width:18px;height:18px}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- landing ---------- */
.land{flex:1;overflow-y:auto;padding:0 20px 36px}
.land .top,.ptop{display:flex;justify-content:space-between;align-items:center;padding:12px 0 0}
.hl{font:600 37px/1.08 var(--serif);letter-spacing:-.018em;margin:24px 0 12px}
[dir=rtl] .hl{font:700 33px/1.3 var(--sans);letter-spacing:0}
.hl span{display:block}
.land .lede,#pitch .lede{font-size:16px;margin-bottom:22px}
.lic{position:relative;background:#fff;border:1px solid #C6C6BE;border-radius:3px;padding:12px 14px 12px;font-size:12px;line-height:1.35;
  background-image:repeating-linear-gradient(135deg,rgba(40,69,166,.04) 0 1px,transparent 1px 7px),repeating-linear-gradient(45deg,rgba(40,69,166,.04) 0 1px,transparent 1px 7px);
  box-shadow:0 18px 26px -22px rgba(17,19,24,.6)}
.lic-h{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:12.5px;padding-bottom:8px;border-bottom:1.5px solid var(--ink)}
.lic-r{display:grid;grid-template-columns:74px 1fr 74px;gap:8px;padding:6px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.lic-r .le,.lic-r .la{color:var(--ink2);font-size:11px}
.lic-r .la{text-align:right}
.lic-r .lv{font:500 12.5px/1.35 var(--mono);text-align:center}
.lic-f{display:flex;gap:10px;align-items:center;padding:10px 92px 0 0;font-size:10.5px;color:var(--ink2);min-height:62px}
.lic-f svg{width:44px;height:44px;flex:none}
.lic-s{position:absolute;right:-8px;bottom:-30px;width:100px;transform:rotate(-11deg)}
.cta{display:grid;gap:4px;justify-items:center;margin:44px 0 0}
.dates{border-top:1px solid var(--ink)}
.dates>div{display:grid;grid-template-columns:46px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.dates b{font:600 24px/1 var(--serif)}
.dates strong{display:block;font-weight:600;font-size:15.5px}
.dates small{font-size:14px;color:var(--ink2)}
.dates small.r{color:var(--due);font-weight:600}
.dates .dk{font-size:11px;color:var(--ink2);display:block;font-weight:500;font-family:var(--sans);margin-bottom:1px}
.loop{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.loop li{display:grid;grid-template-columns:46px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:15.5px;align-items:baseline}
.loop b{font:600 20px/1 var(--serif)}
.proof{margin:26px 0 0;display:grid;gap:8px;font-size:13.5px;color:var(--ink2)}
.proof b{color:var(--ink);font-weight:600}
.pfoot{margin-top:16px;display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px}

/* ---------- onboarding ---------- */
fieldset{border:0;padding:0;margin:20px 0 0;min-width:0}
legend,.lbl{padding:0;font-weight:600;font-size:15px;margin-bottom:6px;display:block}
.seg4{display:grid;grid-template-columns:repeat(4,1fr);border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.seg4 button{padding:12px 2px;text-align:center;font-size:14.5px;font-variant-numeric:tabular-nums;border-inline-start:1px solid var(--ink)}
.seg4 button:first-child{border-inline-start:0}
.seg4 button[aria-checked=true]{background:var(--ink);color:#fff;font-weight:600}
input[type=text]{width:100%;font:inherit;color:inherit;border:1.5px solid var(--ink);border-radius:8px;padding:12px;background:#fff}
.building{flex:1;display:grid;place-content:center;justify-items:center;gap:8px;padding:30px;text-align:center}
.building .seal{width:150px;margin-bottom:18px;transform:rotate(-10deg);animation:slam .45s cubic-bezier(.2,.8,.3,1.25) 1.5s both}
.building p{opacity:0;animation:rise .35s forwards;font-size:16px}
.building p:nth-of-type(2){animation-delay:.5s}.building p:nth-of-type(3){animation-delay:1s}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- plan ---------- */
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 0 10px}
.dayhead .d{font:600 62px/.86 var(--serif);letter-spacing:-.03em}
.dayhead .d small{display:block;font:500 13px/1 var(--sans);color:var(--ink2);margin-bottom:7px;letter-spacing:0}
.dayhead .d i{font:500 16px/1 var(--sans);color:var(--ink2);letter-spacing:0;font-style:normal}
.dayhead .m{font-size:13.5px;color:var(--ink2);text-align:end;line-height:1.4}
.dayhead .m b{display:block;color:var(--ink);font-weight:600}
.ruler{width:100%;height:auto}
.next{background:var(--sheet);border:1.5px solid var(--ink);border-radius:10px;padding:16px;margin:16px 0 0}
.next .k{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:600;margin-bottom:8px}
.next h3{font:600 21px/1.22 var(--serif);margin:0 0 6px}
[dir=rtl] .next h3{font:700 19px/1.45 var(--sans)}
.next p{margin:0 0 14px;font-size:14.5px;color:var(--ink2)}
.ph{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 0;padding-bottom:6px;border-bottom:1px solid var(--ink);font-size:13.5px}
.ph b{font-weight:600}.ph span{color:var(--ink2)}
.step{display:grid;grid-template-columns:36px 1fr auto 16px;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--rule);text-decoration:none}
.step>.ico{width:16px;height:16px;color:var(--off);margin-top:4px;grid-column:4}
.step .dn{font:600 18px/1.3 var(--sans)}
.step .tt{font-weight:500;line-height:1.3;display:block}
.step .au{font-size:13px;color:var(--ink2);display:block;margin-top:2px}
.st{font-size:13px;font-weight:600;text-align:end;max-width:112px;line-height:1.3;padding-top:2px}
.st.due{color:var(--due)}.st.ok{color:var(--stamp)}.st.soft{color:var(--ink2);font-weight:500}
details.donelist{margin-top:24px}
details.donelist summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);font-weight:600;font-size:15px}
details.donelist summary::-webkit-details-marker{display:none}
details.donelist summary::after{content:"+";font-weight:400;font-size:22px;line-height:.8}
details.donelist[open] summary::after{content:"\2013"}
.step.done .tt,.step.done .dn{color:var(--ink2);font-weight:400}

/* ---------- step ---------- */
.stampbox{float:inline-end;width:98px;margin:-2px -2px 4px 10px;transform:rotate(-9deg)}
[dir=rtl] .stampbox{margin:-2px 10px 4px -2px;transform:rotate(9deg)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:0 16px;border-top:1px solid var(--ink);margin:14px 0 0;clear:both}
.dl dt,.dl dd{margin:0;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.dl dt{color:var(--ink2)}
.dl dd{font-weight:600;text-align:end}
.dl dd.bad{color:var(--due)}
.todo{list-style:none;margin:0;padding:0}
.todo li{padding:0}
.todo li>*{display:flex;gap:10px;padding:7px 0;font-size:15px;width:100%}
.todo .bx{width:18px;height:18px;border:1.5px solid var(--ink);border-radius:3px;flex:none;margin-top:3px;display:grid;place-items:center}
.todo .bx .ico{width:13px;height:13px;stroke-width:2.6;display:none}
.todo .ok .bx,.todo [aria-checked=true] .bx{background:var(--stamp);border-color:var(--stamp);color:#fff}
.todo .ok .bx .ico,.todo [aria-checked=true] .bx .ico{display:block}
.opts{border-top:1px solid var(--ink)}
.opt{display:grid;grid-template-columns:22px 1fr auto;gap:2px 12px;padding:13px 0;border-bottom:1px solid var(--rule);width:100%;align-items:start}
.opt .rd{width:20px;height:20px;border:1.5px solid var(--ink);border-radius:50%;margin-top:2px;display:grid;place-items:center;grid-row:1/4}
.opt[aria-checked=true] .rd::after,.opt.on .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink)}
.opt b{font-weight:600}
.opt .pr{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:end}
.opt .pr.tag{font-size:13px;color:var(--stamp)}
.opt .ds{grid-column:2/-1;font-size:13.5px;color:var(--ink2)}
.opt .mt{grid-column:2/-1;font-size:13px;margin-top:3px;display:flex;gap:2px 14px;flex-wrap:wrap}
.opt .mt .g{color:var(--brass);font-weight:600}
.opt[aria-checked=true],.opt.on{background:var(--sheet);margin:0 -18px;padding:13px 18px;width:calc(100% + 36px)}
.opt.flat{grid-template-columns:1fr auto}
.opt.flat .rd{display:none}.opt.flat .ds,.opt.flat .mt{grid-column:1/-1}
/* action bar: a fixed row of the shell, not a sticky child of the scroller */
.actions{flex:none;background:var(--paper);border-top:1px solid var(--rule);padding:12px 18px 10px}
.actions.end{padding-bottom:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}

.slam{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(244,244,241,.86)}
.slam svg{width:220px;transform:rotate(-10deg);animation:slam .45s cubic-bezier(.2,.8,.3,1.25) both}
@keyframes slam{0%{transform:rotate(-24deg) scale(2.5);opacity:0}55%{opacity:1}100%{transform:rotate(-10deg) scale(1);opacity:1}}

/* ---------- cash ---------- */
.say{font:600 23px/1.25 var(--serif);margin:6px 0 6px;letter-spacing:-.01em}
[dir=rtl] .say{font:700 21px/1.5 var(--sans);letter-spacing:0}
.figs{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);padding:10px 0;margin:14px 0 14px}
.figs small{display:block;font-size:12.5px;color:var(--ink2)}
.figs b{font:600 19px/1.25 var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.chart svg{width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:18px;border-top:2.5px solid var(--ink);vertical-align:middle;margin-inline-end:5px}
.legend i.p1{border-top:2.5px dashed var(--stamp)}.legend i.p2{border-top:2.5px dashed var(--due)}
.sees{border-inline-start:3px solid var(--due);padding-inline-start:14px;margin:20px 0 0;font-size:15px}
.sees b{display:block;font-size:13.5px;margin-bottom:2px}
.sees.ok{border-color:var(--stamp)}

/* ---------- record ---------- */
.plaque{width:100%;height:auto;margin:4px 0 2px;filter:drop-shadow(0 12px 12px rgba(17,19,24,.22))}
.plaque .pop{animation:pop .7s cubic-bezier(.2,1.6,.4,1) .15s both;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%{transform:scale(0) rotate(-50deg);opacity:0}100%{transform:none;opacity:1}}
.unlock{border:1.5px solid var(--ink);background:var(--sheet);border-radius:10px;padding:13px 16px;margin:2px 0 14px;animation:rise .4s both}
.unlock b{display:block;font:600 21px/1.2 var(--serif)}
[dir=rtl] .unlock b{font:700 19px/1.4 var(--sans)}
.unlock span{font-size:14px;color:var(--ink2)}
.unlock span{display:block}
.unlock .btn{margin-top:12px}
.scoreline{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:18px}
.scoreline b{font:600 42px/1 var(--serif);letter-spacing:-.02em}
.scoreline b small{font:500 14px/1 var(--sans);color:var(--ink2);letter-spacing:0}
.scoreline span{font-size:14px;color:var(--ink2);text-align:end}
.meter{position:relative;height:6px;background:var(--rule);margin:12px 0 22px}
.meter span{position:absolute;inset-block:0;inset-inline-start:0;background:var(--ink)}
.meter i{position:absolute;top:-4px;width:1.5px;height:14px;background:var(--ink)}
.meter em{position:absolute;top:11px;font-style:normal;font-size:11px;color:var(--ink2);transform:translateX(-50%);font-variant-numeric:tabular-nums}
[dir=rtl] .meter em{transform:translateX(50%)}
.meter em.hit{color:var(--brass);font-weight:600}
.credit{background:var(--sheet);border:1.5px solid var(--ink);border-radius:10px;padding:14px 16px;margin:18px 0 12px}
.credit small{font-size:13px;font-weight:600}
.credit p{font-size:14.5px;color:var(--ink2)}
.credit b{display:block;font:600 34px/1.1 var(--serif);letter-spacing:-.02em;margin:2px 0 6px}
[dir=rtl] .credit b{font:700 28px/1.3 var(--sans);letter-spacing:0}
.rows .sn{font-weight:600;min-width:58px;color:var(--brass);letter-spacing:1px}
.rows .cur{font-weight:600}
.rows .dim{color:var(--ink2)}.rows .dim .sn{color:var(--off)}

/* ---------- providers, programmes, messages, plans ---------- */
.cats{display:flex;gap:22px;overflow-x:auto;margin:14px -18px 0;padding:0 18px;border-bottom:1px solid var(--ink);scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{padding:13px 0 11px;font-size:15px;color:var(--ink2);white-space:nowrap;border-bottom:3px solid transparent}
.cats button[aria-selected=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.cats+.opts{border-top:0}
.prog{padding:16px 0;border-bottom:1px solid var(--rule);display:grid;gap:5px}
.prog:first-of-type{border-top:1px solid var(--ink)}
.prog small{font-size:12.5px;color:var(--ink2)}
.prog h3{font:600 18px/1.25 var(--serif);margin:0}
[dir=rtl] .prog h3{font:700 17px/1.45 var(--sans)}
.prog .by{font-size:13px;color:var(--ink2)}
.prog p{font-size:14.5px}
.prog .why{font-size:13.5px;color:var(--stamp);font-weight:500}
.prog .btn{min-height:44px;margin-top:6px}
.sheet-bg{position:absolute;inset:0;background:rgba(17,19,24,.45);z-index:5;display:flex;align-items:flex-end}
.sheet{background:var(--sheet);border-top:2px solid var(--ink);padding:18px 18px 20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));width:100%;animation:up .22s both;max-height:88%;overflow:auto;overscroll-behavior:contain}
.has-sheet .view{overflow:hidden}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font:600 19px/1.25 var(--serif);margin:0 0 2px}
[dir=rtl] .sheet h3{font:700 18px/1.45 var(--sans)}
.thread{display:grid;gap:10px}
.msg{background:var(--sheet);border:1px solid var(--rule);border-radius:2px 12px 12px 12px;padding:11px 13px;max-width:92%;font-size:15px}
[dir=rtl] .msg{border-radius:12px 2px 12px 12px}
.msg small{display:block;font-size:12px;color:var(--ink2);margin-bottom:3px}
.msg a{font-weight:600;font-size:14.5px;padding-bottom:2px}
.msg.later{background:transparent;border-style:dashed;border-color:var(--off);color:var(--ink2)}
.sw{width:40px;height:23px;border-radius:99px;background:var(--ink);position:relative;flex:none;align-self:center}
.sw::after{content:"";position:absolute;top:2.5px;inset-inline-end:2.5px;width:18px;height:18px;border-radius:50%;background:#fff}
.sw.off{background:var(--off)}.sw.off::after{inset-inline-end:auto;inset-inline-start:2.5px}
.tier{border-top:1px solid var(--ink);padding:14px 0 16px}
.tier header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.tier header b{font-weight:600;font-size:16px}
.tier .p{font:600 24px/1 var(--serif);white-space:nowrap;letter-spacing:-.01em}
.tier .p small{font:400 13px/1 var(--sans);color:var(--ink2);letter-spacing:0}
[dir=rtl] .tier .p{font:700 20px/1.2 var(--sans);letter-spacing:0}
.tier ul{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:14.5px}
.tier li{display:flex;gap:8px}
.tier li .ico{width:17px;height:17px;margin-top:3px;stroke-width:2.2}
.tier.em{border:1.5px solid var(--ink);border-radius:10px;background:var(--sheet);padding:14px 16px 16px;margin-top:6px}

.toast{flex:none;margin:0 18px 8px;background:var(--ink);color:#fff;border-radius:8px;padding:12px 14px;font-size:14px;animation:rise .25s both;text-align:center}

/* ---------- all screens ---------- */
#shots{display:none;padding:28px 28px 60px;min-height:100%}
#shots>header{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
#shots>header h1{font:600 36px/1 var(--serif);margin:0}
#shots>header .cta{display:flex;margin:0;gap:18px;align-items:center}
#shots>header .btn{width:auto}
.shots-grid{display:flex;flex-wrap:wrap;gap:26px 22px;direction:ltr}
.shot{width:254px}
.shot-frame{width:254px;height:536px;border:6px solid var(--ink);border-radius:28px;overflow:hidden;background:var(--ink);display:block;cursor:pointer}
.shot-frame .app{width:390px;height:844px;transform:scale(.6205);transform-origin:0 0;pointer-events:none}
.shot>p{margin:8px 2px 0;font-size:13.5px;color:var(--ink2)}
body.is-shots #stage{display:none}
body.is-shots #shots{display:block}


.risk{color:var(--due);font-weight:600;font-size:14.5px;margin-top:8px}
.lock{border:1.5px dashed var(--ink2);border-radius:10px;padding:12px 14px;margin-top:16px;display:grid;gap:0;font-size:14.5px}
.learn{margin-top:22px;border-top:1px solid var(--ink)}
.learn summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:13px 0;font-weight:600;font-size:15px;border-bottom:1px solid var(--rule)}
.learn summary::-webkit-details-marker{display:none}
.learn summary::after{content:"+";font-weight:400;font-size:22px;line-height:.8}
.learn[open] summary::after{content:"\2013"}
.learn p,.learn ul{font-size:14.5px;margin:10px 0 0}
.learn b{display:block;font-size:14px;margin-top:12px}
.learn ul,.plain{padding-inline-start:20px}
.plain{font-size:15px;margin:12px 0 0}
.banks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.bk{border:1.5px solid var(--rule);background:var(--sheet);border-radius:10px;padding:10px 6px;display:grid;justify-items:center;gap:4px;font-size:12.5px;text-align:center;min-height:96px;align-content:center}
.bk[aria-checked=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.bk img{height:30px;max-width:82%;object-fit:contain}
.bk .mono{height:30px;min-width:34px;padding:0 6px;display:grid;place-items:center;border:1px solid var(--ink);border-radius:6px;font:600 12px/1 var(--sans)}
.bk small{color:var(--stamp);font-weight:600;font-size:11px}
#capn{font:600 26px/1.2 var(--serif);text-align:center;border:1.5px solid var(--ink);border-radius:8px;padding:8px;width:100%;background:#fff;color:inherit}
input[type=range]{width:100%;accent-color:var(--ink);margin:12px 0 0;height:30px}
.caprow{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2)}
.ext{width:16px;height:16px;margin-inline-start:6px}

.up{display:flex;align-items:center;gap:10px;border:1px solid var(--ink);border-radius:10px;padding:10px 12px;margin-top:14px;font-size:14px;line-height:1.35;background:var(--sheet);color:inherit;text-decoration:none}
.up i{font:600 11px/1 var(--sans);letter-spacing:.04em;background:var(--ink);color:#fff;padding:5px 7px;border-radius:4px;flex:none}
/* no letter-spacing on Arabic: it breaks the joins on iOS */
[dir=rtl] .up i{letter-spacing:0}
.up>span{flex:1}
.up .ico{flex:none;width:18px;height:18px}
.skip{display:block;width:100%;margin:6px 0 0;background:none;border:0;font:500 14.5px var(--sans);color:var(--ink2);text-decoration:underline;text-underline-offset:3px;padding:10px;min-height:44px;cursor:pointer;text-align:center}
.opt .mr{color:var(--ink);font-weight:600}
.bk{background:#fff;min-height:74px}
.bk img{height:auto;width:auto;max-height:34px;max-width:92%}
.bk img.dk{border-radius:5px;max-height:38px}
.byc{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink2)}
.byc img{height:26px;width:auto;flex:none}
h2.sk{color:var(--due)}
/* ---------- sizes ---------- */
@media (max-width:899px){
  /* 100% is the fallback for iOS before 15.4, which does not know dvh and would drop the rule */
  body:not(.is-shots){overflow:hidden;overscroll-behavior:none}
  #stage{display:block;padding:0;height:100%;height:100dvh;min-height:0}
  #pitch{display:none}
  #dock{position:static;height:100%;height:100dvh;display:block}
  #device{width:100%;height:100%;height:100dvh;border:0;border-radius:0}
  #shots{padding:18px 14px 40px}
  .shots-grid{justify-content:center}
}
/* phone held sideways: the action bar becomes one row and the bars slim down, so content keeps most of the height */
@media (max-height:480px) and (max-width:899px){
  .bar{min-height:44px;padding-top:0;padding-bottom:0}
  .actions{display:flex;align-items:center;gap:14px;padding:8px 18px}
  .actions.end{padding-bottom:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  .actions .btn{min-height:44px;flex:1}
  .actions .skip{width:auto;margin:0;flex:none;padding:10px 6px}
  .tabs a{grid-auto-flow:column;justify-content:center;align-items:center;gap:6px;padding:0;min-height:44px}
  .toast{margin-bottom:6px;padding:8px 14px}
}
@media (max-width:359px){
  /* iPhone SE and other 320px screens: give the licence value column room so the trade name does not wrap to seven lines */
  .hl{font-size:33px;margin-top:18px}
  [dir=rtl] .hl{font-size:30px}
  .lic{padding:12px}
  .lic-r{grid-template-columns:54px 1fr 54px;gap:6px}
  .lic-r .lv{font-size:11.5px}
}
@media (min-width:900px){
  #pitch .hl{font-size:46px;margin-top:22px}
  [dir=rtl] #pitch .hl{font-size:38px}
  #pitch .cta{grid-template-columns:auto auto;justify-content:start;align-items:center;gap:22px;margin-top:40px}
  #pitch .btn{width:auto}
  #pitch .dates b{font-size:22px}
}
@media (min-width:900px) and (max-height:980px){
  #stage{gap:72px;padding:0 44px}
  #pitch{padding-top:26px}
  #device{zoom:.84}
  #pitch .hl{font-size:40px;margin:16px 0 8px}
  [dir=rtl] #pitch .hl{font-size:34px}
  #pitch .lede{font-size:15px;margin-bottom:16px}
}
@media (min-width:900px) and (max-height:800px){
  #device{zoom:.72}
}
/* the three lines on the building screen start hidden and are revealed by an animation: show them outright when motion is reduced */
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.building p{opacity:1}}
</style>

  if(r.q.get('s')==='warn')S.warn=r.arg||'s7';}

  if(r.name==='shots'){document.body.classList.add('is-shots');shots();return}
  document.body.classList.remove('is-shots');
  const name=r.name||(wide?'roadmap':'landing');
  if(name==='building')setTimeout(()=>{if(parse().name==='building')go('#/roadmap')},2600);
  if(name!=='programmes')S.sheet=null;
  if(name!=='step'&&name!=='bank')S.warn=null;
  if(name!=='stars'&&name!=='cash')S.unlock=0;
  /* remember where each screen was scrolled to; give it back on a re-render of the same screen and on the way back to it */
  const key=name+(r.arg||''),old=$('.view',app)||$('.land',app);
  if(old&&app.dataset.route){const d=$('details.donelist',app);SCR[app.dataset.route]={y:old.scrollTop,open:!!(d&&d.open)}}
  const mem=(app.dataset.route===key||goingBack)?SCR[key]:null;goingBack=false;
  app.innerHTML=html(name,r.arg)+(S.slam?`<div class="slam">${doneStamp(S.slam.day)}</div>`:'');
  app.dataset.route=key;
  /* an open sheet is a modal dialog: the screen behind is inert and does not scroll, and focus moves into the sheet */
  const sheet=$('.sheet',app);app.classList.toggle('has-sheet',!!sheet);
  if(sheet){for(const ch of app.children)if(!ch.classList.contains('sheet-bg'))ch.setAttribute('inert','');if(!sheet.contains(document.activeElement))try{sheet.focus({preventScroll:true})}catch(e){sheet.focus()}}
  if(mem&&mem.open){const d=$('details.donelist',app);if(d)d.open=true}
  const v=$('.view',app)||$('.land',app);if(v&&mem)v.scrollTop=mem.y;
  pitch();save();
}

/* the toast is a row of the shell above the action bar, so it cannot cover a button. It is removed in place: a re-render would drop focus and close the keyboard. */
function say(k){toast=t(k);clearTimeout(toastT);toastT=setTimeout(()=>{toast=null;const el=$('#app .toast');if(el)el.remove()},2600)}
function go(h){if(location.hash===h)render();else location.hash=h}

/* live links: the official site opens in a new tab. The button turns into "Done. Stamp it" when the judge comes back, which the browser reports
   with visibilitychange (tab switch), pageshow (back from a same-tab visit) or focus. The visit is saved first, so it also survives iOS reloading the tab.
   The timer only covers a browser that never left the page, e.g. a blocked pop-up. */
let away=null,awayT=0,hold=0;
function returned(){if(!away)return;away=null;clearTimeout(awayT);render()}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(away)away.hid=true}else returned()});
addEventListener('pageshow',e=>{if(e.persisted)render();else returned()});
addEventListener('focus',()=>{if(away&&away.hid&&!document.hidden)returned()});
/* double-tap guard: for a third of a second after a stamp or a skip, taps do nothing. The second tap of a double tap would otherwise land on whatever
   has just appeared under the finger: the next step's Skip, or the tab under the sheet's last button. */
document.addEventListener('click',e=>{if(Date.now()<hold){e.preventDefault();e.stopPropagation()}},true);
/* sheets: opening one adds a history entry, so the phone's back button closes it. Closing by button, backdrop or Escape takes that entry away again. */
function shut(){if(!S.warn&&!S.sheet)return;S.warn=null;S.sheet=null;render();const o=opener&&$('#app [data-act="'+opener+'"]');if(o)o.focus()}

addEventListener('popstate',e=>{if(!(e.state&&e.state.sheet))shut()});
document.addEventListener('click',e=>{
  /* a link inside a sheet replaces the sheet's history entry instead of stacking on it */
  const inSheet=e.target.closest('.sheet a[href^="#/"]');if(inSheet&&history.state&&history.state.sheet){e.preventDefault();S.warn=null;S.sheet=null;location.replace(inSheet.getAttribute('href'));return}
  /* in-app Back: go back in history when the plan is the previous entry, otherwise replace this entry. Either way no new entry, so the phone's back button never bounces to the step again. */
  const bk=e.target.closest('a.back');if(bk&&!e.metaKey&&!e.ctrlKey){e.preventDefault();const h=bk.getAttribute('href'),n=TRAIL.length;
    if(n>1&&TRAIL[n-2]===keyOf(h))history.back();else{TRAIL.pop();goingBack=true;location.replace(h)}return}
  const el=e.target.closest('[data-act]');if(!el)return;
  if(e.target.closest('[data-stop]')&&el.classList.contains('sheet-bg'))return;

  if(a==='open'){go('#/'+el.dataset.act.slice(5));return}
  if(a==='begin'){if(!S.touched){S=demo();CK={};VIS={};OWN={}}toast=null;setTimeout(render,0);return}
  if(a==='reset'){S=demo();CK={};VIS={};OWN={};toast=null;wipe();setTimeout(render,0);return}
  if(a==='jump'){S=demo({biz:S.biz,activity:S.activity,emirati:S.emirati,capital:S.capital});setTimeout(render,0);return}
  if(a==='ob'){const O=S._ob,i=$('#biz');if(i)O.biz=i.value;O[b]=c==='true'?true:c==='false'?false:(b==='capital'?+c:c);render();return}
  if(a==='build'){const O=S._ob||{},i=$('#biz'),biz=(i&&i.value.trim())||DEF_BIZ;
    S=fresh({biz,activity:O.activity||'cafe',emirati:O.emirati!==false,capital:O.capital||150000,touched:1});CK={};VIS={};OWN={};go('#/building');return}
  if(a==='cat'){cat=b;render();return}
  if(a==='pick'){S.touched=1;S.picks[b]=c;render();if(c==='own'){const o=$('#own');if(o)o.focus()}return}
  if(a==='visit'){S.touched=1;VIS[b]=1;save();away={hid:document.hidden};clearTimeout(awayT);awayT=setTimeout(()=>{if(away&&!away.hid&&!document.hidden)returned()},1500);return}
  if(a==='check'){CK[b]=!CK[b];render();return}
  if(a==='bankpick'){S.touched=1;S.bankPick=b;render();return}
  if(a==='sheet'||a==='warn'){if(a==='sheet')S.sheet=b;else S.warn=b;opener=el.dataset.act;try{history.pushState({sheet:1},'')}catch(e){}render();return}
  if(a==='closesheet'){closeSheet();return}
  if(a==='skip'){S.touched=1;SK()[b]=S.day;S.warn=null;const nx=nextOpen(),dest=nx?hrefOf(nx):'#/roadmap';say('toastSkip');hold=Date.now()+350;
    if(history.state&&history.state.sheet&&location.hash!==dest)location.replace(dest);else go(dest);return}

});

  const sh=$('#app .sheet');if(!sh)return;
  if(e.key==='Escape'){e.preventDefault();closeSheet();return}
  if(e.key==='Tab'){const f=[...sh.querySelectorAll('a[href],button:not([disabled])')];if(!f.length)return;const a=document.activeElement,first=f[0],last=f[f.length-1];
    if(e.shiftKey&&(a===first||a===sh||!sh.contains(a))){e.preventDefault();last.focus()}else if(!e.shiftKey&&(a===last||!sh.contains(a))){e.preventDefault();first.focus()}}});
/* after a move to another screen: start at the top and put focus on its heading, so a screen reader announces where the judge landed */
function focusHead(){const el=$('#app .unlock')||$('#app h1')||$('#app .dayhead');if(!el)return;el.setAttribute('tabindex','-1');try{el.focus({preventScroll:true})}catch(e){el.focus()}}
/* TRAIL mirrors the tab's history so "back" can be told from "forward": back restores the scroll position, forward starts at the top */
const keyOf=h=>{const r=parse(h);return r.name+(r.arg||'')};
addEventListener('hashchange',()=>{const k=keyOf(),n=TRAIL.length;let back=goingBack;
  if(n>1&&TRAIL[n-2]===k){TRAIL.pop();back=true}else if(TRAIL[n-1]!==k)TRAIL.push(k);
  goingBack=back;render();if(!back){const v=$('#app .view')||$('#app .land');if(v)v.scrollTop=0}focusHead()});
addEventListener('resize',()=>{const w=matchMedia('(min-width:900px)').matches;if(w!==wide)render()});
/* first visit: a phone set to Arabic opens in Arabic. A saved choice or ?lang= in the link wins. */
if(!load()&&/^ar\b/i.test(navigator.language||''))lang='ar';
TRAIL.push(keyOf());
render();
})();
